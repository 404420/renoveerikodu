# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply contextual internal links
        run: node scripts/apply-internal-links.mjs
      - name: Apply service knowledge sections
        run: node scripts/apply-service-knowledge.mjs
      - name: Apply service FAQ expansions
        run: node scripts/apply-service-faqs.mjs
      - name: Apply final GEO refinements
        run: node scripts/apply-final-geo-refinements.mjs
      - name: Apply structured data
        run: node scripts/apply-structured-data.mjs
      - name: Validate structured data JSON
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function stripTags(value) {
            return value.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          }
          const servicePages = new Set([
            'betoonitood.html',
            'fassaaditood.html',
            'fassaadivarvimine.html',
            'katusetood.html',
            'kipsitood.html',
            'lammutustood.html',
            'ledlahendused.html',
            'lumetood.html',
            'maalritood.html',
            'parketipaigaldus.html',
            'plaatimine.html',
            'seinapaneelidepaigaldus.html',
            'tapeetimine.html',
            'tellingutepaigaldus.html',
            'vundamenditood.html'
          ]);
          for (const file of fs.readdirSync('.').filter((name) => name.endsWith('.html'))) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];
            if (scripts.length !== 1) throw new Error(`${file}: expected 1 JSON-LD script, got ${scripts.length}`);
            const data = JSON.parse(scripts[0][1]);
            const graph = data['@graph'] || [data];
            const ids = graph.map((node) => node['@id']).filter(Boolean);
            if (ids.length !== new Set(ids).size) throw new Error(`${file}: duplicate @id in schema graph`);
            if (!servicePages.has(file)) continue;
            const visibleQuestions = [...html.matchAll(/<details[^>]*>[\s\S]*?<summary[^>]*>([\s\S]*?)<\/summary>[\s\S]*?<\/details>/gi)].map((match) => stripTags(match[1]));
            const faqNodes = graph.filter((node) => node['@type'] === 'FAQPage');
            if (visibleQuestions.length !== 8) throw new Error(`${file}: expected 8 visible service FAQs, got ${visibleQuestions.length}`);
            if (faqNodes.length !== 1) throw new Error(`${file}: expected exactly one FAQPage schema node`);
            const schemaQuestions = (faqNodes[0].mainEntity || []).map((item) => item.name);
            if (schemaQuestions.length !== visibleQuestions.length) throw new Error(`${file}: FAQ schema count does not match visible FAQ count`);
            for (const question of visibleQuestions) {
              if (!schemaQuestions.includes(question)) throw new Error(`${file}: FAQ schema missing visible question: ${question}`);
            }
          }
          NODE
      - name: Persist generated GEO updates
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add *.html scripts/apply-structured-data.mjs scripts/apply-internal-links.mjs scripts/apply-service-knowledge.mjs scripts/apply-service-faqs.mjs scripts/apply-final-geo-refinements.mjs .github/workflows/static.yml
            git commit -m "Apply final GEO refinement pass"
            git push
          else
            echo "Generated GEO updates are already up to date."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
